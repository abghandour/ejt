name: JaneyGames
options:
  bundleIdPrefix: com.jtopgames
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  JaneyGames:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Resources/**"
      - path: Sources/Resources/languages.json
        buildPhase: resources
      - path: Sources/Resources/Assets.xcassets
        buildPhase: resources
      - path: Sources/Resources/Dictionaries
        type: folder
        buildPhase: resources
      - path: Sources/Resources/TriviaImages
        type: folder
        buildPhase: resources
      - path: JaneyGames.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jtopgames.janeygames
        PRODUCT_NAME: JaneyGames
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: JaneyGames.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Janey Games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSUbiquitousContainers: ""
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  JaneyGamesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JaneyGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jtopgames.janeygames.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JaneyGames.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/JaneyGames"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  JaneyGames:
    build:
      targets:
        JaneyGames: all
        JaneyGamesTests: [test]
    run:
      config: Debug
      storeKitConfiguration: JaneyGames.storekit
    test:
      config: Debug
      targets:
        - JaneyGamesTests
